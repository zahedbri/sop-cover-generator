<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOP & Cover Letter Generator</title>
  <style>
    :root {
      --bg-light: #f8f9fb;
      --bg-dark: #0d0d0f;
      --card-light: #ffffff;
      --card-dark: #1b1b1f;
      --text-light: #111111;
      --text-dark: #f4f4f5;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --radius: 16px;
      --transition: 0.25s ease;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg-light);
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: background var(--transition), color var(--transition);
    }
    @media (prefers-color-scheme: dark) {
      body { background: var(--bg-dark); color: var(--text-dark); }
    }

    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: white;
      padding: 1rem 2rem;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    header h1 { margin: 0; font-size: 1.8rem; }

    main {
      flex: 1;
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }
    @media (min-width: 900px) {
      main { grid-template-columns: 1fr 1fr; }
    }

    .card {
      background: var(--card-light);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      padding: 1.5rem;
      transition: background var(--transition), box-shadow var(--transition);
    }
    .card:hover { box-shadow: 0 12px 28px rgba(0,0,0,0.12); }
    @media (prefers-color-scheme: dark) {
      .card { background: var(--card-dark); box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    }

    label { display: block; margin: 0.75rem 0 0.25rem; font-weight: 600; }
    input, textarea, button, select {
      width: 100%;
      border-radius: 10px;
      border: 1px solid #ccc;
      padding: 0.6rem 0.8rem;
      font-size: 1rem;
      transition: border var(--transition), background var(--transition);
      font-family: inherit;
    }
    input:focus, textarea:focus { border-color: var(--primary); outline: none; }

    button {
      background: var(--primary);
      color: white;
      font-weight: 600;
      cursor: pointer;
      border: none;
      margin-top: 1rem;
      transition: background var(--transition), transform var(--transition);
    }
    button:hover { background: var(--primary-hover); transform: translateY(-1px); }
    button.secondary { background: none; color: var(--primary); border: 1px solid var(--primary); }
    button.secondary:hover { background: var(--primary); color: white; }

    .output {
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 0.95rem;
      padding-top: 0.5rem;
    }

    .tab-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .tabs button {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 0.5rem;
      cursor: pointer;
      margin-right: 0.5rem;
      background: #e5e7eb;
      transition: background var(--transition);
    }
    .tabs button.active { background: var(--primary); color: white; }
    @media (prefers-color-scheme: dark) {
      .tabs button { background: #27272a; color: var(--text-dark); }
      .tabs button.active { background: var(--primary); color: white; }
    }

    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      color: #666;
    }

    /* Toast styling */
    #toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--primary);
      color: white;
      padding: 0.75rem 1.25rem;
      border-radius: 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      transform: translateY(10px);
      z-index: 50;
    }
    #toast.show {
      opacity: 1;
      pointer-events: all;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <header>
    <h1>🎓 SOP & Cover Letter Generator</h1>
    <p style="margin-top: 0.25rem; font-size: 0.95rem; opacity: 0.9;">Create professional drafts directly in your browser</p>
  </header>

  <main>
    <section class="card">
      <h2 style="margin-top:0">Your Details</h2>
      <label>Name</label>
      <input id="name" placeholder="e.g., Alex Johnson">
      <label>Subject / Program</label>
      <input id="subject" placeholder="e.g., Computer Science">
      <label>University / Company</label>
      <input id="university" placeholder="e.g., Harvard University or Acme Corp">
      <label>Course / Job Link</label>
      <input id="courseLink" placeholder="https://...">
      <label>Email</label>
      <input id="email" placeholder="you@example.com">
      <label>Location</label>
      <input id="location" placeholder="City, Country">
      <label>Resume Text or Notes</label>
      <textarea id="resumeText" rows="6" placeholder="Paste your resume or bullet points here"></textarea>
      <div style="display:flex; gap:0.5rem;">
        <button id="generateBtn">Generate</button>
        <button class="secondary" id="clearBtn">Clear</button>
      </div>
    </section>

    <section class="card">
      <div class="tab-bar">
        <div class="tabs">
          <button id="tabSOP" class="active">Statement of Purpose</button>
          <button id="tabCL">Cover Letter</button>
        </div>
        <div>
          <button class="secondary" id="copyBtn">Copy</button>
          <button class="secondary" id="downloadBtn">Download</button>
        </div>
      </div>
      <article id="output" class="output">Fill the form and click Generate.</article>
    </section>
  </main>

  <footer>
    <p>Built with ❤️ for students & professionals — runs fully in your browser.</p>
  </footer>

  <div id="toast"></div>

  <script>
    const $ = sel => document.querySelector(sel);
    const toast = (msg) => {
      const t = $('#toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    };

    const todayISO = () => new Date().toISOString().split('T')[0];

    const extractKeyPoints = (text) => {
      const lines = (text || '').split(/\n+/).map(l => l.trim()).filter(Boolean);
      const skills = [], experiences = [], education = [];
      for (const l of lines) {
        if (/python|java|sql|data|react|aws|docker/i.test(l)) skills.push(l);
        if (/Intern|Engineer|Developer|Manager|Analyst|Research/i.test(l)) experiences.push(l);
        if (/BSc|MSc|PhD|University|College/i.test(l)) education.push(l);
      }
      return { skills, experiences, education };
    };

    const buildSOP = (f, kp) => `Statement of Purpose\n\n${f.name} — ${f.subject}\n${f.university}\nDate: ${todayISO()}\n\nI am applying to the ${f.subject} program at ${f.university} to expand my knowledge and skills. My experience in ${kp.skills.join(', ') || 'relevant areas'} has strengthened my motivation to pursue advanced study.\n\nI believe ${f.university} provides the ideal environment for research and collaboration that aligns with my career goals.`;

    const buildCover = (f, kp) => `${f.name}\n${f.location || ''} | ${f.email || ''}\nDate: ${todayISO()}\n\nDear Hiring Committee,\n\nI am excited to apply for the ${f.subject} position at ${f.university}. With experience in ${kp.skills.join(', ') || 'relevant technologies'}, I am confident my background aligns with your team’s needs.\n\nThank you for your time and consideration.\n\nSincerely,\n${f.name}`;

    let activeTab = 'SOP';
    let generated = { SOP: '', CL: '' };

    $('#generateBtn').addEventListener('click', () => {
      const f = {
        name: $('#name').value.trim(),
        subject: $('#subject').value.trim(),
        university: $('#university').value.trim(),
        courseLink: $('#courseLink').value.trim(),
        email: $('#email').value.trim(),
        location: $('#location').value.trim(),
        resume: $('#resumeText').value.trim()
      };
      if (!f.name || !f.subject || !f.university) {
        toast('Please fill in Name, Subject, and University.');
        return;
      }
      const kp = extractKeyPoints(f.resume);
      generated.SOP = buildSOP(f, kp);
      generated.CL = buildCover(f, kp);
      $('#output').textContent = generated[activeTab];
      toast('Generated successfully!');
    });

    $('#clearBtn').addEventListener('click', () => {
      ['name','subject','university','courseLink','email','location','resumeText'].forEach(id => $('#' + id).value = '');
      $('#output').textContent = 'Fill the form and click Generate.';
      toast('Cleared form');
    });

    $('#tabSOP').addEventListener('click', () => {
      activeTab = 'SOP';
      $('#tabSOP').classList.add('active');
      $('#tabCL').classList.remove('active');
      $('#output').textContent = generated.SOP || 'Generate your SOP first.';
    });

    $('#tabCL').addEventListener('click', () => {
      activeTab = 'CL';
      $('#tabCL').classList.add('active');
      $('#tabSOP').classList.remove('active');
      $('#output').textContent = generated.CL || 'Generate your Cover Letter first.';
    });

    $('#copyBtn').addEventListener('click', () => {
      const text = generated[activeTab];
      if (!text) return toast('Nothing to copy');
      navigator.clipboard.writeText(text);
      toast('Copied to clipboard!');
    });

    $('#downloadBtn').addEventListener('click', () => {
      const text = generated[activeTab];
      if (!text) return toast('Nothing to download');
      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${activeTab.toLowerCase()}_${todayISO()}.txt`;
      a.click();
      URL.revokeObjectURL(url);
      toast('File downloaded');
    });
  </script>
</body>
</html>
